  content:
    message: >-
      Hi, can you write a test-conversation for me, which I can use for testing
      the taskyon app?
  configuration: &ref_0
    model: meta-llama/llama-3.2-90b-vision-instruct
    chatApi: taskyon
  name: taskyon app
  debugging:
    taskPrompt:
      - role: system
        content: >-
          You are a helpful assistant called *Taskyon*. In your markdown-based
          responses, you can use the following features:


          - **Mermaid charts**: Include diagrams, mindmaps, Gantt diagrams,
          quadrants, and XY charts using the 'mermaid' keyword in fenced code
          blocks. For example:

          ```mermaid

          ...

          ```

          - **SVG graphics**: Use HTML to embed SVG graphics.

          - **HTML widgets**: Create interactive elements within the markdown
          using HTML.

          - **MathJax**: Write mathematical formulas using $$ ... $$ for block
          formulas and $ ... $ for inline formulas. **Note:** Only `$` and `$$`
          syntax is supported.
    streamContent: >-
      **Test Conversation for Taskyon App**

      =====================================


      ### Test Case 1: Basic Conversation


      *   User: Hi, how are you?

      *   Taskyon: I'm doing well, thank you for asking. How can I assist you
      today?

      *   User: I'm good, thanks. What can you do?

      *   Taskyon: I can help with a wide range of tasks, from answering
      questions to generating text and more. What's on your mind?


      ### Test Case 2: MathJax Support


      *   User: Can you render a mathematical formula using MathJax?

      *   Taskyon: $$\frac{-b \pm \sqrt{b^2-4ac}}{2a}$$

      *   User: How about an inline formula? $a^2 + b^2 = c^2$

      *   Taskyon: $a^2 + b^2 = c^2$ is a well-known equation.


      ### Test Case 3: Mermaid Chart


      *   User: Can you create a simple flowchart using Mermaid?

      *   Taskyon:
          ```mermaid
          graph LR
              A[Start] --> B{Decision}
              B -->|Yes| C[Action 1]
              B -->|No| D[Action 2]
              C --> E[End]
              D --> E
          ```
      *   User: How about a sequence diagram?

      *   Taskyon:
          ```mermaid
          sequenceDiagram
              participant Alice
              participant Bob
              Alice->>Bob: Hello Bob, how are you?
              Bob->>Alice: I am good thanks!
          ```

      ### Test Case 4: SVG Graphics


      *   User: Can you embed an SVG graphic?

      *   Taskyon:
          ```html
          <svg width="100" height="100">
              <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
          </svg>
          ```
      *   User: How about a more complex graphic?

      *   Taskyon:
          ```html
          <svg width="200" height="200">
              <rect x="10" y="10" width="50" height="50" fill="blue" />
              <rect x="70" y="10" width="50" height="50" fill="red" />
              <rect x="130" y="10" width="50" height="50" fill="green" />
          </svg>
          ```

      ### Test Case 5: HTML Widgets


      *   User: Can you create a simple HTML button?

      *   Taskyon:
          ```html
          <button onclick="alert('Button clicked!')">Click me</button>
          ```
      *   User: How about a text input field?

      *   Taskyon:
          ```html
          <input type="text" placeholder="Enter your name" />
          ```

      ### Test Case 6: Conversation Flow


      *   User: Can you help me with a task?

      *   Taskyon: What task do you need help with?

      *   User: I need help with writing a story.

      *   Taskyon: What kind of story are you trying to write?

      *   User: A science fiction story.

      *   Taskyon: That sounds interesting. What's the plot of your story?


      These test cases cover various features of the Taskyon app, including
      basic conversation, MathJax support, Mermaid charts, SVG graphics, HTML
      widgets, and conversation flow.
