- role: function
  name: test
  content:
    type: functioncall
    data:
      name: chatCompletion
      arguments:
        prompts:
          - >-
            Here is list of all the tools which are available to you:


            - name: jinaMarkdownReader
              description: A tool that reads websites as markdown using the jina ai reader.
            - name: jinaSearch
              description: A tool that searches using the Jina AI search API.
            - name: clock
              description: A tool that provides the current time, date, and weekday.
            - name: location
              description: A tool that provides the current browser location and IP address.
            - name: delayedNotification
              description: Displays a browser-native notification with an optional delay.
            - name: newWindowOpener
              description: Opens a new window with the provided HTML code.
            - name: windowManager
              description: Manages previously opened windows.
            - name: waitForPostMessage
              description: >-
                Waits for and converts a specific window.postMessage event into structured
                data before continuing.
            - name: openMeteoWeatherTool
              description: A tool that fetches weather data using the Open-Meteo API.
            - name: animatedClock
              description: A tool that generates an animated clock with the current time and date.
            - name: issueListGenerator
              description: >-
                Converts a text message into a list of issues and then generates a UI for
                review and GitLab submission.
            - name: getGitlabInfo
              description: Fetch selected parts of your GitLab data (profile, projects, groups).
            - name: gitReader
              description: >-
                Extracts files from a Git repository using isomorphic-git with memfs and a
                dynamically imported HTTP client.
            - name: testSecretStore
              description: Sets then gets a secret in the SecretStore to verify it works.
            - name: opfsStorage
              description: Save and load files using local Origin Private File System (OPFS) storage
            - name: taskPlanner
              description: >-
                Organizes complex tasks into groups that can be worked on independently. Use
                this tool only when breaking down a task into subtasks makes sense—not for
                simple tasks.
            - name: gDriveBrowser
              description: Interact with Google Drive to save, load, and publish files
            - name: proceduralTreeGenerator
              description: >-
                Generates an abstract procedural tree graphic in a new browser window using
                Canvas and JavaScript.
            - name: wfcGenerator
              description: >-
                Generates abstract line-art via Wave Function Collapse in a new browser
                window.
            - name: executePythonScript
              description: Executes a Python script and returns the result.
            - name: localVectorStore
              description: >-
                This tool can store Information and perform semantic search in a vector
                database, ideal
                  for retrieving documents or data segments with high relevance to natural language queries. You can use labels to
                  make sure that the search is only performed in a specific segment of the database.
            - name: executeJavaScript
              description: Runs JavaScript code
            - name: toolCreationWizard
              description: Wizard for guiding LLMs in creating new tool definitions step-by-step.
            - name: modifyPrompts
              description: Modify the current prompts in llmSettings
            - name: chatCompletion
              description: >-
                Generates a chat-based response using the OpenAI API for the previous
                message.
            - name: toolSearcher
              description: >-
                You can use this tool to do the following:

                - Get a list of all tool names.

                - Get the definition of a single tool including source code, if available.
                (not case sensitive)
            - name: chooseTool
              description: Chooses and parameterizes a tool for execution based on provided context.
            - name: taskSearcher
              description: Search through available tasks using a search string
            - name: addNewTool
              description: Validates and registers a new tool with taskyon.
            - name: ensureOauthLogin
              description: Ensure, that we have an oauth token for the calling tool.


            Can you please choose 3 of these which you think might be relevant
            for this

            task. Only choose one if you think it would help you to solve the
            task.


            Examples are:

            - something that you can't answer with pure text

            - a math problem

            - something that requires an API call

            - ... and more! make sure to think about it!


            If you are sure that none of the tools are relevant, your choice
            should be simple string "no".
        llmTools: false
        schema:
          type: object
          properties:
            reasoning_steps:
              type: array
              items:
                type: string
              description: The reasoning steps leading to the final conclusion.
            choice:
              anyOf:
                - enum:
                    - 'no'
                  description: >-
                    If you are sure no tools are required for an answer, choose
                    "no" as an answer instead of a list!
                - type: array
                  description: List of tool names you think might be relevant
                  items:
                    type: string
          additionalProperties: false
          required:
            - reasoning_steps
            - choice
