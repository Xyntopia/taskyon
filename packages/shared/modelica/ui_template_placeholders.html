<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rumoca Model UI</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: #121a26;
        --panel2: #0f1622;
        --text: #e7eefc;
        --muted: #9bb0d1;
        --accent: #6aa6ff;
        --bad: #ff6a6a;
        --good: #7dffb2;
        --border: #24324a;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          'Noto Sans',
          'Liberation Sans',
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, var(--panel), var(--panel2));
      }
      header .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      header .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      main {
        padding: 12px 16px;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 12px;
      }
      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      label {
        font-size: 12px;
        color: var(--muted);
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      input,
      select,
      button {
        min-height: 36px;
      }
      input,
      select,
      textarea {
        background: #0d1420;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 8px 10px;
        outline: none;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        resize: vertical;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
        font-size: 12px;
        line-height: 1.3;
      }
      button {
        -webkit-appearance: none;
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #05101f;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 0;
        cursor: pointer;
        font-weight: 700;
        line-height: 1;
        vertical-align: middle;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .status {
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--muted);
      }
      .status.good {
        color: var(--good);
      }
      .status.bad {
        color: var(--bad);
      }
      .mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
      }
      svg {
        width: 100%;
        height: 420px;
        display: block;
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">Rumoca Model UI</div>
      <div class="subtitle mono" id="modelName">Model</div>
    </header>

    <main>
      <section class="card">
        <div class="row">
          <div style="flex: 1 1 80px">
            <label for="t0">t0</label>
            <input id="t0" type="number" step="any" value="0" style="width: 100%" />
          </div>
          <div style="flex: 1 1 80px">
            <label for="tf">tf</label>
            <input id="tf" type="number" step="any" value="5" style="width: 100%" />
          </div>
          <div style="flex: 1 1 80px">
            <label for="dt">dt</label>
            <input id="dt" type="number" step="any" value="0.01" style="width: 100%" />
          </div>
        </div>

        <div style="margin-top: 10px">
          <label for="solverOpts">Solver options JSON</label>
          <textarea id="solverOpts" spellcheck="false">{}</textarea>
          <div class="hint">
            Options are merged into the solver defaults. Schema is provided by
            <span class="mono">simulateModel.optionsSchema</span> if available.
          </div>
        </div>

        <div style="margin-top: 10px">
          <label for="inputFn">Input function body</label>
          <textarea id="inputFn" spellcheck="false">
// Called as f_u(t)
// Return an array matching the model input order
// Example for 1 input: return [Math.sin(t)]

return [];</textarea
          >
          <div class="hint">
            The function is compiled as <span class="mono">new Function('t', BODY)</span>. It must
            return an array of length <span class="mono" id="nuCount">0</span>.
          </div>
        </div>
        <div class="row" style="margin-top: 10px">
          <button id="runBtn">Run simulation</button>
          <button id="csvBtn" class="secondary" disabled>Download CSV</button>
        </div>

        <div style="margin-top: 10px">
          <div class="status" id="status">Ready.</div>
        </div>

        <div style="margin-top: 12px">
          <label for="seriesSelect">Plot series</label>
          <div class="row">
            <select id="seriesSelect" style="flex: 1 1 auto"></select>
            <button id="axisPlotBtn" type="button" class="secondary">Axis plot</button>
          </div>
          <div id="axisPicker" style="display: none; margin-top: 8px">
            <div class="row">
              <div style="flex: 1 1 180px">
                <label for="xAxisSelect">X axis</label>
                <select id="xAxisSelect" style="width: 100%"></select>
              </div>
              <div style="flex: 1 1 180px">
                <label for="yAxisSelect">Y axis</label>
                <select id="yAxisSelect" style="width: 100%"></select>
              </div>
            </div>
            <div class="row" style="margin-top: 8px">
              <button id="applyAxisPlotBtn" type="button" class="secondary">Plot X/Y</button>
            </div>
          </div>
          <div class="hint">
            Time plot or custom X/Y plot using local model result series.
          </div>
        </div>
      </section>

      <section class="card">
        <svg
          id="plot"
          viewBox="0 0 1000 420"
          preserveAspectRatio="none"
          role="img"
          aria-label="plot"
        >
          <rect x="0" y="0" width="1000" height="420" fill="#0b1220"></rect>
          <g id="grid"></g>
          <g id="axes"></g>
          <polyline id="line" fill="none" stroke="#6aa6ff" stroke-width="2" points=""></polyline>
          <text
            id="plotLabel"
            x="12"
            y="22"
            fill="#9bb0d1"
            font-size="14"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace"
          ></text>
        </svg>
      </section>
    </main>

    <!--
      Placeholder slots.

      The editor will assemble:
      - Generated model JavaScript
      - Selected solver JavaScript
      - This UI HTML template

      at run or export time.

      IMPORTANT:
      - Do not remove these placeholders.
      - They are replaced by string substitution.
    -->

    <script>
      /*__RUMOCA_GENERATED_MODEL_JS__*/
    </script>

    <script>
      /*__RUMOCA_SOLVER_JS__*/
    </script>

    <script>
      'use strict'

      // Minimal runtime glue for the default UI.
      // Requirements:
      // - Generated JS defines global Model()
      // - Solver defines global simulateModel(params, context, model)

      const model = Model()
      const nu = (model?.meta?.inputs || []).length
      const modelName = model?.name || model?.meta?.name || model?.description?.modelName || 'Model'

      document.getElementById('modelName').textContent = `Model: ${modelName}`
      document.getElementById('nuCount').textContent = String(nu)

      const elT0 = document.getElementById('t0')
      const elTf = document.getElementById('tf')
      const elDt = document.getElementById('dt')
      const elSolverOpts = document.getElementById('solverOpts')
      const elInputFn = document.getElementById('inputFn')
      const elRun = document.getElementById('runBtn')
      const elCsv = document.getElementById('csvBtn')
      const elStatus = document.getElementById('status')
      const elSeries = document.getElementById('seriesSelect')
      const elAxisPlotBtn = document.getElementById('axisPlotBtn')
      const elAxisPicker = document.getElementById('axisPicker')
      const elXAxis = document.getElementById('xAxisSelect')
      const elYAxis = document.getElementById('yAxisSelect')
      const elApplyAxisPlot = document.getElementById('applyAxisPlotBtn')
      const elGrid = document.getElementById('grid')
      const elAxes = document.getElementById('axes')
      const elLine = document.getElementById('line')
      const elPlotLabel = document.getElementById('plotLabel')

      // Apply solver-provided default simulation parameters, if present
      try {
        const d = simulateModel?.simDefaults || null
        if (d && typeof d === 'object') {
          if (typeof d.t0 === 'number') elT0.value = String(d.t0)
          if (typeof d.tf === 'number') elTf.value = String(d.tf)
          if (typeof d.dt === 'number') elDt.value = String(d.dt)
        }
      } catch {
        /* empty */
      }

      // Fill solver options textarea from schema defaults (if present)
      try {
        const schema = simulateModel?.optionsSchema || null
        const props = schema?.properties || {}
        const defaults = {}
        for (const k of Object.keys(props)) {
          if (props?.[k] && Object.prototype.hasOwnProperty.call(props[k], 'default')) {
            defaults[k] = props[k].default
          }
        }
        elSolverOpts.value = JSON.stringify(defaults, null, 2)
      } catch {
        elSolverOpts.value = '{}'
      }

      let lastResult = null

      function setStatus(msg, kind) {
        elStatus.textContent = msg
        elStatus.classList.remove('good')
        elStatus.classList.remove('bad')
        if (kind === 'good') elStatus.classList.add('good')
        if (kind === 'bad') elStatus.classList.add('bad')
      }

      function escapeCsv(s) {
        const v = String(s)
        if (v.includes(',') || v.includes('\n') || v.includes('\r') || v.includes('"')) {
          return '"' + v.replaceAll('"', '""') + '"'
        }
        return v
      }

      function toWideCsv(result) {
        const t = result?.data?.t || []
        const x = result?.data?.x || {}
        const y = result?.data?.y || {}
        const u = result?.data?.u || {}
        const c = result?.data?.c || result?.data?.z || {}

        const series = []
        const add = (prefix, obj) => {
          for (const k of Object.keys(obj || {}).sort()) {
            series.push({ key: prefix + k, values: obj[k] || [] })
          }
        }
        add('x.', x)
        add('y.', y)
        add('u.', u)
        add('c.', c)

        const header = ['t'].concat(series.map((s) => formatSeriesLabel(s.key)))
        const lines = [header.map(escapeCsv).join(',')]

        const n = t.length
        for (let i = 0; i < n; i++) {
          const row = [t[i]]
          for (const s of series) row.push(s.values[i])
          lines.push(row.map(escapeCsv).join(','))
        }

        return lines.join('\n')
      }

      function downloadText(filename, content, mime) {
        const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = filename
        a.click()
        setTimeout(() => URL.revokeObjectURL(url), 500)
      }

      function listSeriesKeys(result) {
        const keys = []
        const addGroup = (prefix, obj) => {
          if (!obj) return
          for (const k of Object.keys(obj)) keys.push(prefix + k)
        }
        addGroup('x.', result?.data?.x)
        addGroup('y.', result?.data?.y)
        addGroup('u.', result?.data?.u)
        addGroup('c.', result?.data?.c)
        addGroup('z.', result?.data?.z)
        keys.sort()
        return keys
      }

      function buildSeriesOptions(result, preferredKey) {
        while (elSeries.firstChild) elSeries.removeChild(elSeries.firstChild)
        const keys = listSeriesKeys(result)

        for (const k of keys) {
          const opt = document.createElement('option')
          opt.value = k
          opt.textContent = formatSeriesLabel(k)
          elSeries.appendChild(opt)
        }

        const nextSelection =
          keys.length === 0 ? '' : keys.includes(String(preferredKey || '')) ? preferredKey : keys[0]

        if (nextSelection) elSeries.value = nextSelection
        return String(nextSelection || '')
      }

      function buildAxisSelectors(result, preferredX, preferredY) {
        while (elXAxis.firstChild) elXAxis.removeChild(elXAxis.firstChild)
        while (elYAxis.firstChild) elYAxis.removeChild(elYAxis.firstChild)

        const keys = listSeriesKeys(result)
        const xKeys = ['t'].concat(keys)
        const yKeys = keys.slice()

        for (const k of xKeys) {
          const opt = document.createElement('option')
          opt.value = k
          opt.textContent = k === 't' ? 't (time)' : formatSeriesLabel(k)
          elXAxis.appendChild(opt)
        }
        for (const k of yKeys) {
          const opt = document.createElement('option')
          opt.value = k
          opt.textContent = formatSeriesLabel(k)
          elYAxis.appendChild(opt)
        }

        const xDefault = xKeys.includes(String(preferredX || 't')) ? String(preferredX || 't') : 't'
        const yDefault =
          yKeys.length === 0
            ? ''
            : yKeys.includes(String(preferredY || '')) ? String(preferredY || '') : yKeys[0]
        elXAxis.value = xDefault
        elYAxis.value = yDefault
      }

      function getSeries(result, key) {
        const t = result?.data?.t || []
        const [grp, ...rest] = String(key || '').split('.')
        const name = rest.join('.')
        const group = result?.data?.[grp] || null
        const y = group?.[name] || []
        return { t, y }
      }

      function getSeriesValues(result, key) {
        const k = String(key || '')
        if (!k) return []
        if (k === 't') return Array.isArray(result?.data?.t) ? result.data.t : []
        const [grp, ...rest] = k.split('.')
        const name = rest.join('.')
        const group = result?.data?.[grp] || null
        return Array.isArray(group?.[name]) ? group[name] : []
      }

      function getMetaVariableUnit(group, name) {
        const vars = Array.isArray(group) ? group : []
        for (const v of vars) {
          if (!v || typeof v !== 'object') continue
          if (String(v.name || '') !== name) continue
          const unit = String(v.unit || '').trim()
          if (unit && unit.toLowerCase() !== 'none' && unit.toLowerCase() !== 'null') return unit
        }
        return ''
      }

      function getSeriesUnit(key) {
        const [grp, ...rest] = String(key || '').split('.')
        const name = rest.join('.')
        if (!name) return ''
        if (grp === 'x') return getMetaVariableUnit(model?.meta?.states, name)
        if (grp === 'y') return getMetaVariableUnit(model?.meta?.algebraics, name)
        if (grp === 'u') return getMetaVariableUnit(model?.meta?.inputs, name)
        if (grp === 'c' || grp === 'z') return ''
        return ''
      }

      function formatSeriesLabel(key) {
        const k = String(key || '')
        const unit = getSeriesUnit(k)
        return unit ? `${k} [${unit}]` : k
      }

      const PLOT = {
        width: 1000,
        height: 420,
        marginLeft: 72,
        marginRight: 20,
        marginTop: 46,
        marginBottom: 56,
      }

      function makeSvg(name) {
        return document.createElementNS('http://www.w3.org/2000/svg', name)
      }

      function formatTick(v) {
        const n = Number(v)
        if (!Number.isFinite(n)) return ''
        if (Math.abs(n) >= 1000 || (Math.abs(n) > 0 && Math.abs(n) < 0.01)) return n.toExponential(2)
        return String(Number(n.toFixed(4)))
      }

      function drawGrid() {
        while (elGrid.firstChild) elGrid.removeChild(elGrid.firstChild)
        const plotW = PLOT.width - PLOT.marginLeft - PLOT.marginRight
        const plotH = PLOT.height - PLOT.marginTop - PLOT.marginBottom
        const nx = 10
        const ny = 6
        for (let i = 1; i < nx; i++) {
          const x = PLOT.marginLeft + (i * plotW) / nx
          const ln = makeSvg('line')
          ln.setAttribute('x1', String(x))
          ln.setAttribute('x2', String(x))
          ln.setAttribute('y1', String(PLOT.marginTop))
          ln.setAttribute('y2', String(PLOT.marginTop + plotH))
          ln.setAttribute('stroke', '#1a263b')
          ln.setAttribute('stroke-width', '1')
          elGrid.appendChild(ln)
        }
        for (let j = 1; j < ny; j++) {
          const y = PLOT.marginTop + (j * plotH) / ny
          const ln = makeSvg('line')
          ln.setAttribute('x1', String(PLOT.marginLeft))
          ln.setAttribute('x2', String(PLOT.marginLeft + plotW))
          ln.setAttribute('y1', String(y))
          ln.setAttribute('y2', String(y))
          ln.setAttribute('stroke', '#1a263b')
          ln.setAttribute('stroke-width', '1')
          elGrid.appendChild(ln)
        }
      }

      function drawAxes(xMin, xMax, yMin, yMax, titleLabel, xAxisLabel, yAxisLabel) {
        while (elAxes.firstChild) elAxes.removeChild(elAxes.firstChild)
        const plotW = PLOT.width - PLOT.marginLeft - PLOT.marginRight
        const plotH = PLOT.height - PLOT.marginTop - PLOT.marginBottom
        const x0 = PLOT.marginLeft
        const x1 = PLOT.marginLeft + plotW
        const y0 = PLOT.marginTop
        const y1 = PLOT.marginTop + plotH

        const xAxis = makeSvg('line')
        xAxis.setAttribute('x1', String(x0))
        xAxis.setAttribute('x2', String(x1))
        xAxis.setAttribute('y1', String(y1))
        xAxis.setAttribute('y2', String(y1))
        xAxis.setAttribute('stroke', '#9bb0d1')
        xAxis.setAttribute('stroke-width', '1.5')
        elAxes.appendChild(xAxis)

        const yAxis = makeSvg('line')
        yAxis.setAttribute('x1', String(x0))
        yAxis.setAttribute('x2', String(x0))
        yAxis.setAttribute('y1', String(y0))
        yAxis.setAttribute('y2', String(y1))
        yAxis.setAttribute('stroke', '#9bb0d1')
        yAxis.setAttribute('stroke-width', '1.5')
        elAxes.appendChild(yAxis)

        const tickCount = 5
        for (let i = 0; i <= tickCount; i++) {
          const frac = i / tickCount
          const x = x0 + frac * plotW
          const y = y1 - frac * plotH

          const xTick = makeSvg('line')
          xTick.setAttribute('x1', String(x))
          xTick.setAttribute('x2', String(x))
          xTick.setAttribute('y1', String(y1))
          xTick.setAttribute('y2', String(y1 + 6))
          xTick.setAttribute('stroke', '#9bb0d1')
          xTick.setAttribute('stroke-width', '1')
          elAxes.appendChild(xTick)

          const yTick = makeSvg('line')
          yTick.setAttribute('x1', String(x0 - 6))
          yTick.setAttribute('x2', String(x0))
          yTick.setAttribute('y1', String(y))
          yTick.setAttribute('y2', String(y))
          yTick.setAttribute('stroke', '#9bb0d1')
          yTick.setAttribute('stroke-width', '1')
          elAxes.appendChild(yTick)

          const xText = makeSvg('text')
          xText.setAttribute('x', String(x))
          xText.setAttribute('y', String(y1 + 22))
          xText.setAttribute('fill', '#9bb0d1')
          xText.setAttribute('font-size', '11')
          xText.setAttribute('text-anchor', 'middle')
          xText.textContent = formatTick(xMin + frac * (xMax - xMin))
          elAxes.appendChild(xText)

          const yText = makeSvg('text')
          yText.setAttribute('x', String(x0 - 10))
          yText.setAttribute('y', String(y + 4))
          yText.setAttribute('fill', '#9bb0d1')
          yText.setAttribute('font-size', '11')
          yText.setAttribute('text-anchor', 'end')
          yText.textContent = formatTick(yMin + frac * (yMax - yMin))
          elAxes.appendChild(yText)
        }

        const title = makeSvg('text')
        title.setAttribute('x', String((x0 + x1) / 2))
        title.setAttribute('y', '24')
        title.setAttribute('fill', '#e7eefc')
        title.setAttribute('font-size', '16')
        title.setAttribute('font-weight', '700')
        title.setAttribute('text-anchor', 'middle')
        title.textContent = titleLabel ? `Plot: ${titleLabel}` : 'Plot'
        elAxes.appendChild(title)

        const xLabel = makeSvg('text')
        xLabel.setAttribute('x', String((x0 + x1) / 2))
        xLabel.setAttribute('y', String(PLOT.height - 14))
        xLabel.setAttribute('fill', '#9bb0d1')
        xLabel.setAttribute('font-size', '12')
        xLabel.setAttribute('text-anchor', 'middle')
        xLabel.textContent = xAxisLabel || 'X'
        elAxes.appendChild(xLabel)

        const yLabel = makeSvg('text')
        yLabel.setAttribute('x', '18')
        yLabel.setAttribute('y', String((y0 + y1) / 2))
        yLabel.setAttribute('fill', '#9bb0d1')
        yLabel.setAttribute('font-size', '12')
        yLabel.setAttribute('text-anchor', 'middle')
        yLabel.setAttribute('transform', `rotate(-90 18 ${(y0 + y1) / 2})`)
        yLabel.textContent = yAxisLabel || 'Y'
        elAxes.appendChild(yLabel)
      }

      function plotSeries(xValues, yValues, label, xAxisLabel, yAxisLabel) {
        const plotW = PLOT.width - PLOT.marginLeft - PLOT.marginRight
        const plotH = PLOT.height - PLOT.marginTop - PLOT.marginBottom

        if (
          !Array.isArray(xValues) ||
          !Array.isArray(yValues) ||
          xValues.length === 0 ||
          yValues.length === 0
        ) {
          elLine.setAttribute('points', '')
          drawAxes(0, 1, 0, 1, label || '', xAxisLabel || 'X', yAxisLabel || 'Y')
          elPlotLabel.textContent = label || ''
          return
        }

        const n = Math.min(xValues.length, yValues.length)

        let xMin = Infinity,
          xMax = -Infinity
        let yMin = Infinity,
          yMax = -Infinity
        for (let i = 0; i < n; i++) {
          const xi = Number(xValues[i])
          const yi = Number(yValues[i])
          if (!Number.isFinite(xi) || !Number.isFinite(yi)) continue
          xMin = Math.min(xMin, xi)
          xMax = Math.max(xMax, xi)
          yMin = Math.min(yMin, yi)
          yMax = Math.max(yMax, yi)
        }
        if (
          !Number.isFinite(xMin) ||
          !Number.isFinite(xMax) ||
          !Number.isFinite(yMin) ||
          !Number.isFinite(yMax)
        ) {
          elLine.setAttribute('points', '')
          drawAxes(0, 1, 0, 1, label || '', xAxisLabel || 'X', yAxisLabel || 'Y')
          elPlotLabel.textContent = label || ''
          return
        }
        if (xMax === xMin) xMax = xMin + 1
        if (yMax === yMin) yMax = yMin + 1

        drawAxes(xMin, xMax, yMin, yMax, label || '', xAxisLabel || 'X', yAxisLabel || 'Y')

        const pts = []
        for (let i = 0; i < n; i++) {
          const xi = Number(xValues[i])
          const yi = Number(yValues[i])
          if (!Number.isFinite(xi) || !Number.isFinite(yi)) continue
          const xx = PLOT.marginLeft + ((xi - xMin) / (xMax - xMin)) * plotW
          const yy = PLOT.marginTop + plotH - ((yi - yMin) / (yMax - yMin)) * plotH
          pts.push(xx.toFixed(2) + ',' + yy.toFixed(2))
        }
        elLine.setAttribute('points', pts.join(' '))
        elPlotLabel.textContent = String(label || '')
      }

      function makeFuFromTextarea() {
        const body = String(elInputFn.value || '')
        // eslint-disable-next-line no-new-func
        const fn = new Function('t', body)
        return (t) => {
          let out = fn(t)
          if (out == null) {
            if (nu === 0) return []
            throw new Error('f_u must return an array')
          }
          if (!Array.isArray(out)) {
            if (nu === 1 && typeof out === 'number' && Number.isFinite(out)) return [out]
            throw new Error('f_u must return an array')
          }
          if (out.length !== nu) {
            if (!(nu === 0 && out.length === 0)) {
              throw new Error(`Expected ${nu} inputs but got ${out.length}`)
            }
          }
          return out
        }
      }

      function run() {
        elRun.disabled = true
        elCsv.disabled = true
        setStatus('Running...', '')

        try {
          const t0 = Number(elT0.value)
          const tf = Number(elTf.value)
          const dt = Number(elDt.value)

          if (!Number.isFinite(t0) || !Number.isFinite(tf) || !Number.isFinite(dt)) {
            throw new Error('t0 tf dt must be finite numbers')
          }
          if (dt <= 0) throw new Error('dt must be > 0')
          if (tf <= t0) throw new Error('tf must be > t0')

          const f_u = makeFuFromTextarea()

          let solverOptions = {}
          try {
            solverOptions = JSON.parse(String(elSolverOpts.value || '{}'))
          } catch {
            throw new Error('Solver options JSON is not valid JSON')
          }

          const params = { sim: { t0, tf, dt, f_u, solverOptions } }
          const context = { source: 'ui_template', compiledAt: new Date().toISOString() }

          const result = simulateModel(params, context, model)
          lastResult = result

          const previousSeries = elSeries.value
          const sel = buildSeriesOptions(result, previousSeries)
          buildAxisSelectors(result, elXAxis.value, elYAxis.value)
          const s = getSeries(result, sel)
          plotSeries(s.t, s.y, formatSeriesLabel(sel), 'Time (t)', formatSeriesLabel(sel))

          elCsv.disabled = false
          setStatus('Simulation complete.', 'good')
        } catch (e) {
          console.error(e)
          setStatus(String(e?.message || e), 'bad')
        } finally {
          elRun.disabled = false
        }
      }

      elRun.addEventListener('click', run)
      elSeries.addEventListener('change', () => {
        if (!lastResult) return
        const sel = elSeries.value
        const s = getSeries(lastResult, sel)
        plotSeries(s.t, s.y, formatSeriesLabel(sel), 'Time (t)', formatSeriesLabel(sel))
      })

      elAxisPlotBtn.addEventListener('click', () => {
        if (!lastResult) return
        const visible = elAxisPicker.style.display !== 'none'
        elAxisPicker.style.display = visible ? 'none' : 'block'
      })

      elApplyAxisPlot.addEventListener('click', () => {
        if (!lastResult) return
        const xKey = String(elXAxis.value || 't')
        const yKey = String(elYAxis.value || '')
        if (!yKey) return
        const xValues = getSeriesValues(lastResult, xKey)
        const yValues = getSeriesValues(lastResult, yKey)
        const xLabel = xKey === 't' ? 'Time (t)' : formatSeriesLabel(xKey)
        const yLabel = formatSeriesLabel(yKey)
        plotSeries(xValues, yValues, `${yLabel} vs ${xLabel}`, xLabel, yLabel)
      })

      elCsv.addEventListener('click', () => {
        if (!lastResult) return
        const csv = toWideCsv(lastResult)
        const stamp = new Date().toISOString().replaceAll(':', '-').replaceAll('.', '-')
        downloadText(`simulation_${stamp}.csv`, csv, 'text/csv;charset=utf-8')
      })

      drawGrid()
      drawAxes(0, 1, 0, 1, '', 'Time (t)', 'Value')
      setStatus('Ready.', '')
    </script>
  </body>
</html>
