<!doctype html>
<html lang="en" data-vscode-theme="__TASKYON_THEME__">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="__TASKYON_CSP__" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskyon</title>
    <style>
      body,
      html {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #taskyon-source-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 10;
        display: flex;
        gap: 6px;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px;
        border-radius: 6px;
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      #taskyon-source-toggle button {
        border: 0;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      #taskyon-source-toggle button.active {
        background: #2d8cff;
        color: #fff;
      }
      #taskyon {
        border: none;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }
      #taskyon-shell {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #taskyon-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-top: 1px solid rgba(127, 127, 127, 0.25);
        background: rgba(0, 0, 0, 0.08);
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      #taskyon-clear-context {
        border: 0;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        background: #2d8cff;
        color: #fff;
      }
      #taskyon-context-info {
        opacity: 0.85;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    __TASKYON_CONFIG__
    <div id="taskyon-shell">
      <div id="taskyon-source-toggle">
        <button type="button" data-source="local">Local</button>
        <button type="button" data-source="prod">Prod</button>
      </div>
      <iframe
        id="taskyon"
        src="__TASKYON_IFRAME_SRC__"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
        allow="clipboard-read; clipboard-write; fullscreen"
      ></iframe>
      <div id="taskyon-footer">
        <button id="taskyon-clear-context" type="button">Clear Context</button>
        <div id="taskyon-context-info">0 files, 0 chars</div>
      </div>
    </div>
    <script nonce="__TASKYON_NONCE__" src="__TASKYON_WEBVIEW_SCRIPT__"></script>
  </body>
</html>
