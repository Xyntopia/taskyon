[package]
name = "app"
version = "0.7.0"
description = "Xyntopia Taskyon"
authors = ["you"]
license = ""
repository = "https://github.com/xyntopia/taskyon"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "tracing", "dangerous-settings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
