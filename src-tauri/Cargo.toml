[package]
name = "app"
version = "0.6.1"
description = "Xyntopia Taskyon"
authors = ["you"]
license = ""
repository = "https://github.com/xyntopia/taskyon"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "tracing", "dangerous-settings"] }
tauri-plugin-fs = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

aes-gcm = "0.10"
base64 = "0.22"
fs2 = "0.4"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[dev-dependencies]
tempfile = "3"
